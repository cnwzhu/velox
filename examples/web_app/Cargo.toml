[package]
name = "web_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Velox WebAssembly (wasm32 HTML5 Canvas ImageData) web application example built on velox-kit"

[lib]
name = "web_app"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "web_app_cli"
path = "src/main.rs"

[features]
default = []
winit = ["velox-kit/winit"]

[dependencies]
velox-kit = { path = "../../crates/velox-kit", default-features = false, features = ["std", "component"] }
