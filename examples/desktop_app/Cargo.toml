[package]
name = "desktop_app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Velox Component Gallery — interactive cross-platform desktop component & engine showcase built on velox-component"

[lib]
name = "desktop_app"
path = "src/lib.rs"

[[bin]]
name = "desktop_app"
path = "src/main.rs"

[features]
default = []
custom-shader = ["velox-kit/custom-shader"]

[dependencies]
velox-kit = { path = "../../crates/velox-kit", default-features = false, features = ["gpu", "winit", "component", "canvas", "tokio"] }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "charset", "http2"] }
