[package]
name = "velox-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Velox core UI engine: arena, pod state, 1D fixed-point layout solver, damage tracker, SDF scanline rasterizer, and cross-platform GPU/software backends"

[features]
default = ["std", "gpu"]

# 标准库运行时（公开版固定启用 `std`，保留 `std` feature 名用于兼容下游配置）
std = []

# 默认轻量级 2D SDF GPU 硬件加速后端（纯 wgpu；内置 software 软光栅始终可用）
gpu = ["dep:wgpu"]

# 跨 API / 跨框架零拷贝显存句柄桥接（Windows DX12 NT Handle / Linux Vulkan DMA-BUF / Metal IOSurface / Android AHB）
gpu-interop = ["gpu", "dep:windows", "dep:ash"]

# 跨平台桌面窗口（其余纯 Rust 平台桥接 wayland / android / ios / harmony / web 默认可用）
winit = ["std", "dep:winit", "dep:softbuffer"]

[dependencies]
bumpalo = { workspace = true }
ttf-parser = { workspace = true }
winit = { workspace = true, optional = true }
softbuffer = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true, optional = true }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
ash = { workspace = true, optional = true }

[build-dependencies]
fontdue = { workspace = true }
